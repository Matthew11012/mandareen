<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Rounded square icon with Chinese character "普"</title>
  <desc id="desc">A flat rounded square with a purple-blue gradient background and the white Chinese character "普" centered.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#4f51ff"/>
      <stop offset="100%" stop-color="#5f6bff"/>
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="720" height="720" rx="120" ry="120" fill="url(#g)"/>
  <g transform="translate(400,410)">
    <text
      text-anchor="middle"
      dominant-baseline="middle"
      font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, 'Hiragino Sans GB', 'Segoe UI', sans-serif"
      font-weight="700"
      font-size="420"
      fill="#ffffff"
      style="line-height:1"
    >
      普
    </text>
  </g>
</svg>


